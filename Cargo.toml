[package]
name = "gorget"
version = "1.1.2-alpha"
edition = "2024"

[[bin]]
name = "gg"
path = "src/main.rs"

[dependencies]
logos = "0.15"
codespan-reporting = "0.11"
rustc-hash = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"

[dev-dependencies]
insta = "1"
pretty_assertions = "1"
