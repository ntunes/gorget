name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build

      - name: Unit tests
        run: cargo test --lib

      - name: Integration tests
        run: cargo test --test integration -- --test-threads=1
        env:
          GG_BUILD_TIMEOUT_SECS: 600
          GG_TEST_TIMEOUT_SECS: 600

      - name: Security tests (ASan + UBSan)
        run: cargo test --test security -- --test-threads=1
        env:
          GG_BUILD_TIMEOUT_SECS: 600
          GG_TEST_TIMEOUT_SECS: 600

  llvm-backend:
    name: LLVM Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-llvm-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      # Drives every fixture build through `--backend=llvm` (see gg_command in
      # tests/integration.rs). Tests that exercise paths the LLVM backend
      # doesn't yet support — self-host comparisons, hot-reload, tracing, plus
      # ~17 known LLVM regressions tracked in project_llvm_backend.md — short-
      # circuit via `skip_under_llvm()` so the suite stays green and gates
      # against new regressions while we work the residual list down.
      - name: Integration tests (LLVM backend)
        run: cargo test --test integration --release -- --test-threads=4
        env:
          GG_BACKEND: llvm
          GG_BUILD_TIMEOUT_SECS: 600
          GG_TEST_TIMEOUT_SECS: 600

      # Sanitize-build the security fixtures through `--backend=llvm` so an
      # LLVM-only memory bug (e.g. a regressed `i64`-vs-`ptr` arg width on
      # `free`, or a wrong-size memcpy through a misemitted struct field)
      # surfaces here instead of in a user's program. Mirrors the C-backend
      # security step in the `test` job above. Sequential threads — ASan
      # serialises on its global state, parallel runs flake.
      - name: Security tests (LLVM + ASan + UBSan)
        run: cargo test --test security --release -- --test-threads=1
        env:
          GG_BACKEND: llvm
          GG_BUILD_TIMEOUT_SECS: 600
          GG_TEST_TIMEOUT_SECS: 600
