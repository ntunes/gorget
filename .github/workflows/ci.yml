name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `spec_conformance` adjudicates all THREE lanes (C / LLVM / self-host) in
      # one process: each lane PINS its backend on the build command and
      # deliberately ignores `GG_BACKEND` (tests/spec_conformance.rs:11-15). So
      # the `spec_conformance_llvm` lane needs `llc` HERE, in the default-backend
      # job — without it all ~220 fixtures BUILD-FAIL ("Failed to run 'llc'") and
      # trip the MATCH-count floor. Mirrors the `llvm-backend` job's install step.
      #
      # SDL2: `examples_build_on_every_lane` (tests/integration.rs) is the FIRST
      # currently-run test that COMPILES an SDL program — three C-lane cells
      # (`sdl_hello`, `gfx_demo`, `breakout/main`) have no expectation row and so
      # must build cleanly. Every other SDL touch in the suite is `#[ignore]`d.
      # All THREE dev packages are required, not just `libsdl2-dev`: measured,
      # `gg build` hands the C compiler `-lSDL2 -lSDL2_image -lSDL2_ttf` for all
      # three examples. `add_sdl_flags` (src/main.rs:206-232) decides `needs_image`
      # / `needs_ttf` with `source.contains("GORGET_USE_SDL_IMAGE")` over the
      # GENERATED code — which always contains that string, because the `#ifdef`
      # guard in `src/backend/c/runtime/sdl_runtime.c` spells it. So both sublibs
      # are requested for ANY SDL program, on either branch of that function: via
      # `pkg-config --libs sdl2 SDL2_image SDL2_ttf` (which FAILS as a whole if
      # any one `.pc` is missing) or via the plain `-l` fallback.
      - name: Install LLVM and SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build

      - name: Unit tests
        run: cargo test --lib

      # The structural-guard ratchets (docs/devbook/25-structural-guards.md) —
      # the executable form of Core #6, "convert a recurring bug class into a
      # guard". Cheap (~4s, pure source analysis) and placed early so a broken
      # ratchet fails before the 20-minute suites run.
      # This step was MISSING until 2026-07-26, which meant every ratchet in
      # tests/lints.rs was enforced only by someone remembering to run it
      # locally. That memory failed: no_growth_in_phase_d_proxy_reads went red
      # at 5b8aa6da (2026-07-21) and stayed red for five days across round
      # closes that reported green. A guard CI does not run is not a guard.
      - name: Structural guard ratchets
        run: cargo test --test lints

      # The beginner-code robustness map: 358 cells of ORDINARY code, shapes
      # taken from other languages' tutorials rather than from our own corpus,
      # with hand-derived expectations and spelling-equivalence pairs.
      #
      # It measures what `--test integration` structurally cannot: that suite
      # samples what the compiler's own self-host does, not what a person
      # learning the language writes. A `match` EXPRESSION that ignored its arm
      # guards -- a grade calculator returning "A" for every input -- survived
      # 2113 fixtures and was caught here on the first run.
      #
      # Fails on any WORKS -> broken regression. 24s for 358 cells, so there is
      # no excuse for running it only at round close: a guard CI does not run is
      # not a guard.
      - name: Beginner-code robustness map
        run: python3 scripts/robustness_map.py

      # The BEHAVIOURAL half of the known_gaps graduation ratchet, whose cheap
      # half (`known_gaps_passing_allowlist_shrink_only`) is in the step above.
      #
      # It runs every `#[ignore]`d test that cites a known_gaps fixture and
      # asserts the PASS set still equals tests/gaps/PASSING_ALLOWLIST.txt
      # exactly. The lint alone cannot catch the class: it only fires when a
      # human EDITS the allowlist, so it observes someone RECORDING that an
      # ignored test started passing — never the passing itself. That
      # observation is this script, and a script nobody invokes is prose with a
      # shebang (compare the comment on the step above: "A guard CI does not run
      # is not a guard").
      #
      # IN THE MAIN JOB, not a separate one like the sanitize sweep: measured
      # 2026-08-23 at 1 min 47 s for all 99 rows (regenerate with
      # `time scripts/known_gaps_census.sh`), versus ~25 min for the sweep. The
      # marginal cost is smaller still — the step's `cargo test --no-run --tests`
      # builds the integration binary the later steps need anyway, so it moves
      # that build earlier rather than adding it. Per-commit is the right
      # cadence here: a gap fixed as a side effect of an unrelated round should
      # be caught in the commit that fixes it, while the mechanism is still in
      # someone's head, not at the next round close.
      - name: known_gaps graduation census
        run: scripts/known_gaps_census.sh --check
        env:
          GG_BUILD_TIMEOUT_SECS: 600

      # The `StagingMoveIntoOwnedSlot` consume-site class has NO env-gate runway
      # on the validator (a new consume class is fatal the instant it lands), so
      # it enters through the non-fatal `assign_warnings` list and
      # `GG_STAGING_MOVE_GUARD=fatal` promotes it. THIS STEP is what sets the
      # promoter. Its precedent, `GG_RETURN_SLOT_GUARD`, has never been set by
      # anything outside `src/` — a runway nothing drives is theatre, and the
      # env var (not class membership) is what separates the two burned-down
      # rows from the defects the class was built for, so with the var unset the
      # guard is silent on those too.
      #
      # Measured 2026-08-23 at 39-49 s over all 2109 top-level fixtures
      # (`time scripts/staging_move_burndown.sh --check`): it reconciles the
      # TRIP set by SET EQUALITY over the whole corpus — so a NEW violation
      # anywhere reds the gate — and probes the CLEAN rows for the other side.
      # `--emit-gir` stops before the C backend and the linker, which is why the
      # whole corpus is affordable per-commit: every single build lands under a
      # second (verified by running the gate green with the deadline set to 1 s).
      - name: staging-move consume-guard burn-down
        run: scripts/staging_move_burndown.sh --check
        env:
          GG_STAGING_MOVE_GUARD: fatal
          GG_BUILD_TIMEOUT_SECS: 600

      # The remaining test targets. Enumerated here rather than left to
      # `cargo test` because the other steps need per-target thread counts and
      # env. The `every_test_target_runs_in_ci` lint asserts this list stays
      # complete — all three were red or unrun when it was written.
      - name: C runtime (direct-C tests)
        run: cargo test --test c_runtime

      - name: Integration tests
        run: cargo test --test integration -- --test-threads=1
        env:
          # The self-host parity census is default-ON for the round-close battery
          # (owner 2026-08-22). CI opts out: it already pays for two full sweeps,
          # and here the cost is the COLD self-host driver build (~12 min), not
          # the census itself (~2.5 min once the driver is cached) -- both
          # measured 2026-08-22.
          GG_RUNTIME_DIFF: "0"
          GG_BUILD_TIMEOUT_SECS: 600
          GG_TEST_TIMEOUT_SECS: 600
          # Every stage self-compile deadline (the fixed-point + clone-ceiling
          # tests, plus the pinned-8MB self-compile) honors this knob (default
          # 600s in-code). The stage-1 self-host compile of driver.gg legitimately
          # takes 100-500s user / 4-8x wall on the slow debug --test-threads=1
          # x86_64 runner, so a 600s wall deadline flakes (bootstrap_fixed_point +
          # stage1_clone_ceiling timed out at 600s, 2026-07-24). 1200s gives real
          # headroom without extending healthy runs (deadline only bites on a
          # genuine hang — the clone-ratchet asserts still catch a real clone bomb).
          GG_STAGE1_TIMEOUT_SECS: 1200

      - name: Spec conformance (ggdef)
        run: cargo test -p ggdef -- --test-threads=4

      - name: Spec conformance (production lanes)
        run: cargo test --test spec_conformance -- --test-threads=1
        env:
          GG_BUILD_TIMEOUT_SECS: 600
          GG_TEST_TIMEOUT_SECS: 600

      - name: Security tests (ASan + UBSan)
        run: cargo test --test security -- --test-threads=1
        env:
          GG_BUILD_TIMEOUT_SECS: 600
          GG_TEST_TIMEOUT_SECS: 600

  llvm-backend:
    name: LLVM Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # SDL2 here is FORWARD INSURANCE, not a present need — measured, and stated
      # honestly so nobody trusts a claim that is not true. On this lane the three
      # SDL examples ask the C compiler for `-lm` ONLY: `gfx_demo` and
      # `breakout/main` die at shim compile on `unknown type name 'GorgetSDLWindow'`
      # (gorget-arena snag #1) and `sdl_hello` dies at link on `undefined reference
      # to gorget_sdl_init` (the SDL runtime blob is never emitted under LLVM), all
      # BEFORE any SDL header or library is touched. Both are filed defects that
      # `examples_build_on_every_lane` pins by SYMBOL. The moment either is fixed,
      # this lane starts compiling and linking SDL for real — and would then red on
      # a missing dependency, in an unrelated round, for a reason no one is looking
      # for. Installing it now costs seconds and removes that trap.
      - name: Install LLVM and SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-llvm-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      # Drives every fixture build through `--backend=llvm` (see gg_command in
      # tests/integration.rs). `skip_under_llvm()` short-circuits the handful of
      # tests that READ THE EMITTED `.c` — under `--backend=llvm` there is no
      # `.c` to inspect, so those are a C-backend contract rather than an LLVM
      # gap, and each call site says so. It is NOT a known-regression mechanism:
      # every one of its call sites is that same emitted-`.c` case. Genuine
      # LLVM-lane gaps are filed in TODO.md with a `known_gaps` repro, not
      # skipped here.
      - name: Integration tests (LLVM backend)
        run: cargo test --test integration --release -- --test-threads=4
        env:
          # Opts out of the default-ON self-host parity census; see the C job.
          GG_RUNTIME_DIFF: "0"
          GG_BACKEND: llvm
          GG_BUILD_TIMEOUT_SECS: 600
          GG_TEST_TIMEOUT_SECS: 600

      # Sanitize-build the security fixtures through `--backend=llvm` so an
      # LLVM-only memory bug (e.g. a regressed `i64`-vs-`ptr` arg width on
      # `free`, or a wrong-size memcpy through a misemitted struct field)
      # surfaces here instead of in a user's program. Mirrors the C-backend
      # security step in the `test` job above. Sequential threads — ASan
      # serialises on its global state, parallel runs flake.
      - name: Security tests (LLVM + ASan + UBSan)
        run: cargo test --test security --release -- --test-threads=1
        env:
          GG_BACKEND: llvm
          GG_BUILD_TIMEOUT_SECS: 600
          GG_TEST_TIMEOUT_SECS: 600

  sanitize-sweep:
    name: Sanitize sweep (ASan+UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM and SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev

      - name: Build
        run: cargo build

      # Runs the whole fixture corpus under -fsanitize=address,undefined and
      # diffs against tests/sanitize/{CORRUPTION,LEAK}_ALLOWLIST.txt.
      #
      # A SEPARATE JOB on purpose: ~25 min at parallelism 8, so it must not
      # extend the main gate's wall-clock. It exists because 99.4% of the corpus
      # (2087 of 2100 fixtures) ran an stdout compare and nothing else — and an
      # stdout compare cannot observe a use-after-free. Every memory-safety
      # defect found in R42 was found incidentally by a hand-built ASan probe.
      #
      # The cheap half of this gate — the allowlists are shrink-only, and every
      # corruption row carries a justification — is `sanitize_allowlists_shrink_only`
      # in tests/lints.rs, which runs in the main job on every commit.
      - name: Sanitize sweep
        run: JOBS=8 scripts/sanitize_sweep.sh
        env:
          GG_BUILD_TIMEOUT_SECS: 600
